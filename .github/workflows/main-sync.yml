name: Main synchronization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  main-up-to-date:
    name: Main up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check main ancestry
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Update this branch with the latest main, then retry."
            exit 1
          fi
