<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Serpent</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #12081c;
        color: #f6e7c1;
        font-family: "Segoe UI", "Yu Gothic", sans-serif;
      }

      body {
        overflow: hidden;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 2;
      }

      .hud p {
        margin: 0 0 4px;
        font-size: 16px;
      }

      #map {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 148px;
        height: 148px;
        z-index: 2;
        background: rgba(8, 4, 14, 0.55);
        border: 1px solid rgba(255, 176, 32, 0.4);
      }

      #veil {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: end start;
        padding: 28px;
        background: linear-gradient(90deg, rgba(10, 4, 16, 0.78), rgba(10, 4, 16, 0.15) 70%);
      }

      #veil[hidden] {
        display: none;
      }

      #veil h1 {
        margin: 0 0 10px;
        font-family: "Yu Mincho", Georgia, serif;
        font-size: 44px;
        font-weight: 500;
        color: #ffd7a8;
      }

      #veil p {
        margin: 0 0 10px;
        max-width: 36em;
        line-height: 1.45;
        font-size: 16px;
      }

      button {
        font: 15px/1 "Segoe UI", sans-serif;
        color: #2a1408;
        background: #ffb020;
        border: 0;
        padding: 10px 14px;
        cursor: pointer;
      }

      button:hover {
        background: #ffc14a;
      }

      button:focus-visible {
        outline: 2px solid #fff6ea;
        outline-offset: 3px;
      }

      .steer {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 2;
        display: flex;
        gap: 8px;
      }

      @media (min-width: 800px) {
        .steer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="map" width="148" height="148" aria-hidden="true"></canvas>
    <div class="hud" aria-live="polite">
      <p id="score">Score 0</p>
      <p id="length">Length 16</p>
    </div>
    <div class="steer">
      <button type="button" id="left">Left</button>
      <button type="button" id="right">Right</button>
    </div>
    <div id="veil">
      <div>
        <h1>Neon Serpent</h1>
        <p id="blurb">Eat the teal lights. The trail behind you grows. Walls and your own body end the run.</p>
        <p>Turn with the mouse, or with A and D. Click the street for mouse steering.</p>
        <button type="button" id="start">Start</button>
      </div>
    </div>
    <script src="vendor/three.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
