<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:26px 18px 34px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:#23313d;
    background:radial-gradient(120% 90% at 50% 0%,#eef5fa 0%,#c6d5e2 55%,#a5b8c9 100%);
  }
  h1{margin:0; font-size:clamp(19px,2.6vw,28px); letter-spacing:.1em}
  .sub{margin:0; font-size:12.5px; letter-spacing:.06em; color:#5a6b7a}
  .stage{
    width:min(980px,96vw); border-radius:22px; overflow:hidden; line-height:0;
    box-shadow:0 26px 60px rgba(24,42,58,.30), 0 0 0 1px rgba(255,255,255,.55) inset;
    background:#bfe3f2;
  }
  svg{display:block; width:100%; height:auto}
  .bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center;
    font-size:13px; color:#3a4a58; background:rgba(255,255,255,.62);
    padding:10px 18px; border-radius:999px; box-shadow:0 6px 18px rgba(24,42,58,.12);
  }
  button{font:inherit; padding:7px 16px; border:none; border-radius:999px; cursor:pointer;
    background:#23313d; color:#fff; letter-spacing:.05em}
  button:hover{background:#33475a}
  input[type=range]{accent-color:#e2543f}
  .halo{animation:pulse 6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.32}50%{opacity:.62}}
  .cloud{animation:drift linear infinite}
  .c1{animation-duration:70s;  animation-delay:-6s}
  .c2{animation-duration:98s;  animation-delay:-44s}
  .c3{animation-duration:126s; animation-delay:-70s}
  .c4{animation-duration:86s;  animation-delay:-30s}
  @keyframes drift{from{transform:translateX(600px)}to{transform:translateX(-340px)}}
  .gull{animation:bob 5s ease-in-out infinite}
  .gull.g2{animation-duration:6.8s; animation-delay:-2.6s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
</style>
</head>
<body>

<header style="text-align:center">
  <h1>🚲 骑自行车的鹈鹕</h1>
  <p class="sub">纯 SVG 2D 动画 · 车轮 / 脚踏 / 腿部 IK / 七层背景视差联动</p>
</header>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var TAU = Math.PI * 2, RAD = 180 / Math.PI;

  /* ---- 机械参数（与 SVG 坐标严格一致） ---- */
  var TIRE   = 75;                        // 车轮半径
  var BB     = { x: 525, y: 455 };        // 五通（脚踏轴心）
  var CRANK  = 28;                        // 曲柄长度
  var HIP_N  = { x: 526, y: 352 };        // 近侧腿髋部
  var HIP_F  = { x: 504, y: 346 };        // 远侧腿髋部
  var L1 = 66, L2 = 84;                   // 大腿 / 小腿
  var CADENCE = 1.15;                     // 踩蹬频率（圈/秒）

  var speed = 300, paused = false, elapsed = 0, last = performance.now();

  /* ---- 反向运动学：由髋部与脚点解出膝盖 ---- */
  function solveKnee(hip, foot){
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.sqrt(dx*dx + dy*dy);
    d = Math.max(Math.abs(L1 - L2) + 0.5, Math.min(L1 + L2 - 0.5, d));
    var a = Math.atan2(dy, dx);
    var c = (d*d + L1*L1 - L2*L2) / (2 * d * L1);
    var A = Math.acos(Math.max(-1, Math.min(1, c)));
    var ang = a - A;                      // 膝盖朝前
    return { x: hip.x + L1 * Math.cos(ang), y: hip.y + L1 * Math.sin(ang) };
  }

  function setLeg(hip, foot, pathEl, footEl){
    var k = solveKnee(hip, foot);
    pathEl.setAttribute("d", "M" + hip.x + " " + hip.y + " L" + k.x.toFixed(2) + " " + k.y.toFixed(2)
                            + " L" + foot.x.toFixed(2) + " " + foot.y.toFixed(2));
    footEl.setAttribute("transform", "translate(" + foot.x.toFixed(2) + " " + foot.y.toFixed(2) + ")");
  }

  /* ---- 元素引用 ---- */
  var rig = $("rig"), shadow = $("shadow");
  var wheelRear = $("wheelRear"), wheelFront = $("wheelFront");
  var crankA = $("crankA"), crankB = $("crankB"), pedalA = $("pedalA"), pedalB = $("pedalB");
  var legFarPath = $("legFarPath"), footFar = $("footFar");
  var legNearPath = $("legNearPath"), footNear = $("footNear");
  var chainTop = $("chainTop"), chainBot = $("chainBot");
  var headG = $("headG"), scarfTail = $("scarfTail");
  var wingArm = $("wingArm"), wingArmHi = $("wingArmHi"), wingHand = $("wingHand");
  var eyeG = $("eyeG"), rays = $("rays");
  var layers = [
    { el: $("boats"),     period: 300, factor: 0.10 },  // 帆船
    { el: $("sparkles"),  period: 200, factor: 0.16 },  // 海面碎金
    { el: $("waves1"),    period: 100, factor: 0.20 },
    { el: $("waves2"),    period: 120, factor: 0.28 },
    { el: $("waves3"),    period:  80, factor: 0.38 },
    { el: $("foam"),      period:  90, factor: 0.55 },  // 岸边浪花
    { el: $("rail"),      period: 150, factor: 0.95 },  // 栏杆立柱
    { el: $("grassFar"),  period: 300, factor: 0.90 },
    { el: $("lamps"),     period: 900, factor: 1.00 },  // 路灯
    { el: $("seams"),     period:  75, factor: 1.00 },  // 木板缝
    { el: $("streaks"),   period: 340, factor: 2.20 },  // 风速线
    { el: $("grassNear"), period: 340, factor: 1.50 }   // 前景草
  ];

  function update(t){
    var i, L;

    /* 太阳光芒缓慢自转 */
    rays.setAttribute("transform", "rotate(" + ((t * 8) % 360).toFixed(2) + " 742 86)");

    /* 车轮：转速 = 车速 ÷ 半径，与地面滚动严格同步 */
    var wheelDeg = (t * speed / TIRE * RAD) % 360;
    wheelRear.setAttribute("transform",  "rotate(" + wheelDeg + " 430 420)");
    wheelFront.setAttribute("transform", "rotate(" + wheelDeg + " 680 420)");

    /* 曲柄与脚踏 */
    var ca = t * TAU * CADENCE;
    var cd = ((ca * RAD) % 360 + 360) % 360;
    var p1 = { x: BB.x + CRANK * Math.cos(ca), y: BB.y + CRANK * Math.sin(ca) };
    var p2 = { x: BB.x - CRANK * Math.cos(ca), y: BB.y - CRANK * Math.sin(ca) };
    crankA.setAttribute("transform", "rotate(" + cd + " " + BB.x + " " + BB.y + ")");
    crankB.setAttribute("transform", "rotate(" + (cd + 180) + " " + BB.x + " " + BB.y + ")");
    /* 踏板绕"曲柄子坐标系中"的自身中心反向旋转，才能既保持水平又不漂移 */
    pedalA.setAttribute("transform", "rotate(" + (-cd) + " 553 455)");
    pedalB.setAttribute("transform", "rotate(" + (-cd - 180) + " 497 455)");

    /* 整车随踩蹬轻微起伏，阴影同步呼吸 */
    var bob = 2.6 * Math.sin(ca * 2 + 0.9);
    rig.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    shadow.setAttribute("rx", (134 + bob * 2.2).toFixed(1));
    shadow.setAttribute("opacity", (0.22 - Math.abs(bob) * 0.014).toFixed(3));

    /* 双腿踩蹬：脚精确落在脚踏上 */
    setLeg(HIP_F, p2, legFarPath, footFar);
    setLeg(HIP_N, p1, legNearPath, footNear);

    /* 链条：链轮比 15:9 */
    var cs = t * speed * (15 / 9);
    chainTop.setAttribute("stroke-dashoffset", (cs % 13).toFixed(2));
    chainBot.setAttribute("stroke-dashoffset", (-(cs % 13)).toFixed(2));

    /* 头部晃动 / 围巾飘动 / 翅尖握把 */
    headG.setAttribute("transform", "rotate(" + (3 * Math.sin(t * 2.2)).toFixed(2) + " 620 206)");
    scarfTail.setAttribute("transform", "rotate(" + (12 * Math.sin(t * 9)).toFixed(2) + " 612 250)");
    var tipX = 622 + 1.6 * Math.sin(t * 4.2), tipY = 292 + 2 * Math.sin(t * 4.2 + 1);
    var armD = "M556 288 Q590 282 " + tipX.toFixed(1) + " " + tipY.toFixed(1);
    wingArm.setAttribute("d", armD);
    wingArmHi.setAttribute("d", armD);
    wingHand.setAttribute("transform", "translate(" + tipX.toFixed(1) + " " + tipY.toFixed(1) + ")");

    /* 眨眼 */
    var bt = t % 4.2, k = bt < 0.12 ? 0.12 : 1;
    eyeG.setAttribute("transform", "translate(662 164) scale(1 " + k + ") translate(-662 -164)");

    /* 背景多层视差滚动 */
    for (i = 0; i < layers.length; i++){
      L = layers[i];
      L.el.setAttribute("transform", "translate(" + (-((t * speed * L.factor) % L.period)).toFixed(2) + " 0)");
    }
  }

  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) elapsed += dt;
    update(elapsed);
    requestAnimationFrame(frame);
  }

  /* ---- 生成 12 根锥形太阳光芒（长短交替） ---- */
  (function buildRays(){
    var g = $("rays"), d = "", i, a, cx = 742, cy = 86, ri = 50, w = 6, ro, c, s,
        x1, y1, x2, y2, x3, y3;
    for (i = 0; i < 12; i++){
      a = i * 30 * Math.PI / 180;
      ro = (i % 2) ? 78 : 90;
      c = Math.cos(a); s = Math.sin(a);
      x1 = (cx + ri * c - w * s).toFixed(1); y1 = (cy + ri * s + w * c).toFixed(1);
      x2 = (cx + ri * c + w * s).toFixed(1); y2 = (cy + ri * s - w * c).toFixed(1);
      x3 = (cx + ro * c).toFixed(1);         y3 = (cy + ro * s).toFixed(1);
      d += '<path d="M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2 + 'L' + x3 + ' ' + y3 + 'Z"/>';
    }
    g.innerHTML = d;
  })();

  /* ---- 控件 ---- */
  $("speed").addEventListener("input", function(e){
    speed = +e.target.value;
    $("readout").textContent = speed + " px/s";
  });
  $("toggle").addEventListener("click", function(){
    paused = !paused;
    this.textContent = paused ? "▶ 继续" : "⏸ 暂停";
  });

  update(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
