<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(1100px 640px at 50% 6%, #2b4a68 0%, #17293f 52%, #0b1524 100%);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: #17324d;
  }
  .stage { position: relative; width: min(1120px, 95vw); }
  .scene {
    display: block; width: 100%; height: auto;
    border-radius: 28px;
    box-shadow:
      0 40px 90px rgba(0, 0, 0, .55),
      0 2px 0 rgba(255, 255, 255, .12) inset,
      0 0 0 1px rgba(255, 255, 255, .08);
  }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; inset: 18px 18px auto 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    pointer-events: none;
  }
  .brand { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    background: rgba(255, 255, 255, .82);
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, .65);
    border-radius: 999px; padding: 8px 16px;
    font-size: 13px; letter-spacing: .04em;
    box-shadow: 0 8px 22px rgba(23, 50, 77, .16);
    white-space: nowrap;
  }
  .pill.title {
    font-size: 16.5px; font-weight: 800; letter-spacing: .12em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .pill.title::before {
    content: ""; width: 9px; height: 9px; border-radius: 50%;
    background: linear-gradient(135deg, #ffb14e, #ff7a3d);
    box-shadow: 0 0 0 3px rgba(255, 150, 70, .22);
  }
  .pill.sub { color: #55759a; }
  .pill.tech {
    color: #2f5c7a; font-weight: 600; letter-spacing: .12em; font-size: 12px;
    background: rgba(255, 255, 255, .72);
  }
  .foot {
    position: absolute; inset: auto auto 16px 18px;
    pointer-events: none;
  }
  .pill.tiny {
    padding: 6px 14px; font-size: 11.5px; color: rgba(255, 255, 255, .82);
    background: rgba(15, 30, 45, .38); border-color: rgba(255, 255, 255, .18);
    backdrop-filter: blur(8px); letter-spacing: .06em;
  }
  @media (max-width: 720px) {
    .pill.sub, .pill.tech { display: none; }
  }

  /* ---------- 多层视差滚动 ---------- */
  @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  .l-waves { animation: scrollX 34s linear infinite; }
  .l-coast { animation: scrollX 42s linear infinite; }
  .l-dunes { animation: scrollX 21s linear infinite; }
  .l-meadow { animation: scrollX 11.5s linear infinite; }
  .l-road  { animation: scrollX 5.4s linear infinite; }
  .l-front { animation: scrollX 2.9s linear infinite; }

  /* ---------- 云与帆船 ---------- */
  @keyframes drift { from { transform: translateX(1000px); } to { transform: translateX(-340px); } }
  .drift { animation: drift linear infinite; }
  .d1 { animation-duration: 36s; animation-delay: -8s; }
  .d2 { animation-duration: 50s; animation-delay: -26s; }
  .d3 { animation-duration: 28s; animation-delay: -16s; }
  .d4 { animation-duration: 64s; animation-delay: -40s; }

  /* ---------- 角色小动作 ---------- */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.4px); } }
  .bob { animation: bob .8s ease-in-out infinite; }

  @keyframes pouchWob {
    0%, 100% { transform: scaleY(1) rotate(0deg); }
    50% { transform: scaleY(1.075) rotate(-.6deg); }
  }
  .pouch {
    transform-box: view-box; transform-origin: 560px 204px;
    animation: pouchWob .8s ease-in-out infinite;
  }

  @keyframes scarfFlap { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(8deg); } }
  .scarf-tails {
    transform-box: view-box; transform-origin: 414px 226px;
    animation: scarfFlap .5s ease-in-out infinite;
  }

  @keyframes blink { 0%, 91%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.07); } }
  .eye {
    transform-box: view-box; transform-origin: 477px 188px;
    animation: blink 4.4s ease-in-out infinite;
  }

  @keyframes fishWig { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
  .fish-tail {
    transform-box: view-box; transform-origin: 542px 332px;
    animation: fishWig 1.6s ease-in-out infinite;
  }

  @keyframes glint {
    0%, 35%, 100% { opacity: 0; transform: scale(.5); }
    50% { opacity: .95; transform: scale(1); }
    65% { opacity: 0; transform: scale(.7); }
  }
  .glint {
    transform-box: view-box; transform-origin: 514px 298px;
    animation: glint 3.2s ease-in-out infinite;
  }

  @keyframes speedLine {
    0% { opacity: 0; transform: translateX(34px); }
    22% { opacity: .9; }
    100% { opacity: 0; transform: translateX(-54px); }
  }
  .speed { animation: speedLine 1.6s linear infinite; }

  @keyframes puff {
    0% { opacity: .5; transform: translate(0, 0) scale(.45); }
    100% { opacity: 0; transform: translate(-84px, -18px) scale(1.7); }
  }
  .puff {
    transform-box: view-box; transform-origin: 232px 458px;
    animation: puff 1.6s ease-out infinite;
  }
</style>
</head>
