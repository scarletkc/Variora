<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BB = { x: 450, y: 448 };
  const CRANK = 30;
  const REAR = { x: 236, y: 424 };
  const FRONT = { x: 656, y: 424 };
  const ROLL_R = 68;
  const CADENCE = 0.85;
  const GEAR = 1.22;
  const L1 = 62;
  const L2 = 70;
  const HIP_N = { x: 418, y: 358 };
  const HIP_F = { x: 406, y: 352 };

  const $ = (id) => document.getElementById(id);
  const wheelRear = $('wheel-rear');
  const wheelFront = $('wheel-front');
  const ring = $('ring');
  const rider = $('rider');
  const wing = $('wing');
  const head = $('head');
  const eye = $('eye');
  const pouch = $('pouch');
  const bars = $('bars');
  const shadow = $('shadow');
  const grit = $('grit');
  const chains = document.querySelectorAll('.chain');

  function el(name, attrs) {
    const node = document.createElementNS(NS, name);
    for (const key in attrs) node.setAttribute(key, attrs[key]);
    return node;
  }

  function addSpokes(group, reflector) {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      group.appendChild(el('line', {
        x1: (Math.cos(a) * 12).toFixed(2),
        y1: (Math.sin(a) * 12).toFixed(2),
        x2: (Math.cos(a) * 45).toFixed(2),
        y2: (Math.sin(a) * 45).toFixed(2),
        stroke: '#C5CED6',
        'stroke-width': '1.7',
        'stroke-linecap': 'round'
      }));
    }
    group.appendChild(el('circle', { cx: '38', cy: '0', r: '3.4', fill: reflector }));
    group.appendChild(el('rect', {
      x: '52', y: '-1.6', width: '8', height: '3.2', rx: '1', fill: '#1A1E22'
    }));
  }

  function addTeeth(group, count, r0, r1, width, color) {
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      group.appendChild(el('line', {
        x1: (Math.cos(a) * r0).toFixed(2),
        y1: (Math.sin(a) * r0).toFixed(2),
        x2: (Math.cos(a) * r1).toFixed(2),
        y2: (Math.sin(a) * r1).toFixed(2),
        stroke: color,
        'stroke-width': width,
        'stroke-linecap': 'butt'
      }));
    }
  }

  addSpokes($('spokes-rear'), '#E23B3B');
  addSpokes($('spokes-front'), '#F0B429');
  addTeeth($('cog-teeth'), 8, 11, 16, '3', '#2C333A');
  addTeeth($('ring-teeth'), 12, 16, 23, '4', '#A8B2BC');

  function tilePair(scrollId, tileId) {
    const scroll = $(scrollId);
    const tile = $(tileId);
    const clone = tile.cloneNode(true);
    clone.removeAttribute('id');
    clone.setAttribute('transform', 'translate(1000 0)');
    scroll.appendChild(clone);
    return scroll;
  }

  const cloudScroll = tilePair('cloud-scroll', 'cloud-tile');
  const farScroll = tilePair('far-scroll', 'far-tile');
  const hillScroll = tilePair('hill-scroll', 'hill-tile');
  const treeScroll = tilePair('tree-scroll', 'tree-tile');

  function buildStrip(parent, draw) {
    const tile = el('g');
    draw(tile, 0);
    parent.appendChild(tile);
    const clone = tile.cloneNode(true);
    clone.setAttribute('transform', 'translate(1000 0)');
    parent.appendChild(clone);
  }

  buildStrip($('dash-scroll'), (tile) => {
    for (let x = 0; x < 1000; x += 78) {
      tile.appendChild(el('line', {
        x1: x, y1: 548, x2: x + 34, y2: 548,
        stroke: '#C9B48A', 'stroke-width': '3', 'stroke-linecap': 'round', opacity: '0.85'
      }));
    }
    const spots = [[40, 570, 5, 3], [180, 530, 4, 2.4], [320, 575, 6, 3], [510, 538, 3.5, 2.2], [700, 568, 5, 2.8], [880, 534, 4, 2.3]];
    spots.forEach(([x, y, rx, ry]) => {
      tile.appendChild(el('ellipse', { cx: x, cy: y, rx: rx, ry: ry, fill: '#D2C09A', opacity: '0.7' }));
    });
  });

  function addTufts(tile, yBase, scale, colors) {
    for (let i = 0; i < 14; i++) {
      const x = 20 + i * 70 + (i % 3) * 8;
      const h = scale * (12 + (i * 5) % 9);
      const y = yBase + (i % 4) * 2;
      const color = colors[i % colors.length];
      const d = [
        `M ${x} ${y} q ${h * 0.12} ${-h} ${h * 0.42} ${-h * 0.08}`,
        `M ${x + h * 0.18} ${y} q ${h * 0.08} ${-h * 1.15} ${h * 0.5} ${-h * 0.12}`,
        `M ${x + h * 0.42} ${y} q ${h * 0.16} ${-h * 0.75} ${h * 0.36} 0`
      ].join(' ');
      tile.appendChild(el('path', {
        d: d, fill: 'none', stroke: color, 'stroke-width': (1.3 + scale * 0.15).toFixed(2), 'stroke-linecap': 'round'
      }));
    }
  }

  buildStrip($('tuft-scroll'), (tile) => addTufts(tile, 486, 1, ['#2F6A3C', '#8FCB72', '#3E7A46']));
  buildStrip($('front-tuft-scroll'), (tile) => addTufts(tile, 604, 1.35, ['#245C32', '#3E7A46']));

  const farThigh = $('far-thigh');
  const farShin = $('far-shin');
  const farKnee = $('far-knee');
  const farCrank = $('far-crank');
  const farPedal = $('far-pedal');
  const farFoot = $('far-foot');
  const nearThigh = $('near-thigh');
  const nearShin = $('near-shin');
  const nearThighSh = $('near-thigh-sh');
  const nearShinSh = $('near-shin-sh');
  const nearKnee = $('near-knee');
  const nearKneeHl = $('near-knee-hl');
  const nearCrank = $('near-crank');
  const nearPedal = $('near-pedal');
  const nearFoot = $('near-foot');

  function setLine(node, x1, y1, x2, y2) {
    node.setAttribute('x1', x1.toFixed(2));
    node.setAttribute('y1', y1.toFixed(2));
    node.setAttribute('x2', x2.toFixed(2));
    node.setAttribute('y2', y2.toFixed(2));
  }

  function kneeOf(hip, foot, sign) {
    let dx = foot.x - hip.x;
    let dy = foot.y - hip.y;
    let dist = Math.hypot(dx, dy) || 0.001;
    const max = L1 + L2 - 0.01;
    const min = Math.abs(L1 - L2) + 0.01;
    if (dist > max) {
      dx *= max / dist;
      dy *= max / dist;
      dist = max;
    } else if (dist < min) {
      dx *= min / dist;
      dy *= min / dist;
      dist = min;
    }
    const aim = Math.atan2(dy, dx);
    let cosB = (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist);
    cosB = Math.max(-1, Math.min(1, cosB));
    const ang = aim + sign * Math.acos(cosB);
    return { x: hip.x + Math.cos(ang) * L1, y: hip.y + Math.sin(ang) * L1 };
  }

  function pedalAt(angle) {
    return { x: BB.x + Math.cos(angle) * CRANK, y: BB.y + Math.sin(angle) * CRANK };
  }

  function mod(n, m) {
    return ((n % m) + m) % m;
  }

  function eyeOpen(t) {
    const period = 4;
    const p = t % period;
    const start = 3.72;
    const dur = 0.2;
    if (p < start || p > start + dur) return 1;
    const u = (p - start) / dur;
    const tri = u < 0.5 ? u * 2 : 2 - u * 2;
    return 1 - 0.92 * tri;
  }

  function draw(t) {
    const theta = reduce ? 0.15 : t * CADENCE * Math.PI * 2;
    const wheelAngle = theta * GEAR;
    const scroll = wheelAngle * ROLL_R;
    const bob = Math.sin(theta * 2) * 3.6;
    const wheelDeg = wheelAngle * 180 / Math.PI;

    wheelRear.setAttribute('transform', `translate(${REAR.x} ${REAR.y}) rotate(${wheelDeg})`);
    wheelFront.setAttribute('transform', `translate(${FRONT.x} ${FRONT.y}) rotate(${wheelDeg})`);
    ring.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${theta * 180 / Math.PI})`);

    const near = pedalAt(theta);
    const far = pedalAt(theta + Math.PI);
    const hipN = { x: HIP_N.x, y: HIP_N.y + bob };
    const hipF = { x: HIP_F.x, y: HIP_F.y + bob };
    const kN = kneeOf(hipN, near, -1);
    const kF = kneeOf(hipF, far, -1);

    setLine(farCrank, BB.x, BB.y, far.x, far.y);
    setLine(farThigh, hipF.x, hipF.y, kF.x, kF.y);
    setLine(farShin, kF.x, kF.y, far.x, far.y);
    farKnee.setAttribute('cx', kF.x.toFixed(2));
    farKnee.setAttribute('cy', kF.y.toFixed(2));
    farPedal.setAttribute('transform', `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)})`);
    farFoot.setAttribute('transform', `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)}) rotate(${(6 + Math.sin(theta + Math.PI) * 3).toFixed(2)})`);

    setLine(nearCrank, BB.x, BB.y, near.x, near.y);
    setLine(nearThighSh, hipN.x, hipN.y + 1.5, kN.x, kN.y + 1.5);
    setLine(nearShinSh, kN.x, kN.y + 1.5, near.x, near.y + 1.5);
    setLine(nearThigh, hipN.x, hipN.y, kN.x, kN.y);
    setLine(nearShin, kN.x, kN.y, near.x, near.y);
    nearKnee.setAttribute('cx', kN.x.toFixed(2));
    nearKnee.setAttribute('cy', kN.y.toFixed(2));
    nearKneeHl.setAttribute('cx', (kN.x - 1.6).toFixed(2));
    nearKneeHl.setAttribute('cy', (kN.y - 1.8).toFixed(2));
    nearPedal.setAttribute('transform', `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)})`);
    nearFoot.setAttribute('transform', `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)}) rotate(${(6 + Math.sin(theta) * 3).toFixed(2)})`);

    rider.setAttribute('transform', `translate(0 ${bob.toFixed(2)})`);
    wing.setAttribute('transform', `rotate(${(Math.sin(theta) * 7 + Math.sin(t * 6.2) * 1.4).toFixed(2)} 400 312)`);
    const tilt = Math.sin(t * 1.15) * 1.6;
    head.setAttribute('transform', `translate(0 ${(-bob * 0.62).toFixed(2)}) rotate(${tilt.toFixed(2)} 526 188)`);

    const swallowPhase = t % 5.2;
    let swallow = 0;
    if (swallowPhase > 4.75) {
      swallow = Math.sin(((swallowPhase - 4.75) / 0.45) * Math.PI) * 0.13;
    }
    const gulp = 1 + Math.sin(t * 2.6) * 0.035 + swallow;
    pouch.setAttribute('transform', `translate(548 198) scale(1 ${gulp.toFixed(4)}) translate(-548 -198)`);

    const open = eyeOpen(t);
    eye.setAttribute('transform', `translate(544 164) scale(1 ${open.toFixed(4)}) translate(-544 -164)`);

    bars.setAttribute('transform', `rotate(${(Math.sin(t * 0.8) * 2.2).toFixed(2)} 594 336)`);
    shadow.setAttribute('rx', (150 + Math.sin(theta * 2) * 8).toFixed(1));

    cloudScroll.setAttribute('transform', `translate(${-mod(scroll * 0.08 + t * 10, 1000)} 0)`);
    farScroll.setAttribute('transform', `translate(${-mod(scroll * 0.1, 1000)} 0)`);
    hillScroll.setAttribute('transform', `translate(${-mod(scroll * 0.22, 1000)} 0)`);
    treeScroll.setAttribute('transform', `translate(${-mod(scroll * 0.36, 1000)} 0)`);
    $('tuft-scroll').setAttribute('transform', `translate(${-mod(scroll * 0.78, 1000)} 0)`);
    $('dash-scroll').setAttribute('transform', `translate(${-mod(scroll, 1000)} 0)`);
    $('front-tuft-scroll').setAttribute('transform', `translate(${-mod(scroll * 1.28, 1000)} 0)`);
    grit.setAttribute('patternTransform', `translate(${-mod(scroll, 24)} 0)`);
    const dash = (-wheelAngle * 16).toFixed(2);
    chains.forEach((node) => node.setAttribute('stroke-dashoffset', dash));
  }

  const start = performance.now();
  function frame(now) {
    draw((now - start) / 1000);
    if (!reduce) requestAnimationFrame(frame);
  }
  if (reduce) draw(0);
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
