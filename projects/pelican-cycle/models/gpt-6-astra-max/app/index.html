<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>A Pelican's Coastal Ride</title>
  <style>
    :root {
      --paper: #f4eddf;
      --ink: #243b3a;
      --muted: #63736b;
      --orange: #d76338;
      --lap: 1.35s;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: 38px 6vw 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 5%, #fffaf1 0, transparent 55%),
        repeating-linear-gradient(0deg, #263c3903 0 1px, transparent 1px 4px),
        var(--paper);
      font-family: "Palatino Linotype", "Book Antiqua", "Noto Serif SC", "Songti SC", serif;
    }
    .page { width: min(1120px, 100%); margin: auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .eyebrow, .edition, .caption, button, .speed {
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
    }
    .eyebrow { margin: 0 0 12px; color: var(--orange); font-size: 11px; font-weight: 700; letter-spacing: .24em; }
    h1 { margin: 0; font-size: clamp(30px, 4.5vw, 53px); font-weight: 500; letter-spacing: -.04em; line-height: 1.15; }
    h1 span { display: inline-block; margin-left: 10px; color: var(--orange); font-style: italic; font-size: .7em; }
    .edition { font-size: 10px; letter-spacing: .17em; text-align: right; line-height: 1.8; color: var(--muted); white-space: nowrap; }
    .frame { position: relative; overflow: hidden; border: 1px solid #243b3a2b; border-radius: 7px; background: #e8eee3; box-shadow: 0 18px 45px #4547370a; }
    .scene { display: block; width: 100%; height: auto; }
    .scene * { transform-box: view-box; }
    .scene .outlined { stroke: var(--ink); stroke-width: 3.3; stroke-linecap: round; stroke-linejoin: round; }
    .scene .fine { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .scene .wheel { animation: wheel-turn var(--lap) linear infinite; }
    .rear-wheel { transform-origin: 383px 426px; }
    .front-wheel { transform-origin: 677px 426px; }
    .crank { transform-origin: 514px 426px; animation: wheel-turn var(--lap) linear infinite; }
    .rider { animation: bob var(--lap) ease-in-out infinite; }
    .scarf { transform-origin: 526px 253px; animation: flutter .48s ease-in-out infinite alternate; }
    .scarf-tip { transform-origin: 493px 254px; animation: flutter .66s ease-in-out infinite alternate-reverse; }
    .wing { transform-origin: 477px 279px; animation: wing-rock var(--lap) ease-in-out infinite; }
    .eye { transform-origin: 559px 180px; animation: blink 5.6s infinite; }
    .horizon-drift { animation: scenery 65s linear infinite; }
    .sea-drift { animation: scenery 26s linear infinite; }
    .ground-drift { animation: scenery calc(var(--lap) * 5) linear infinite; }
    .cloud { animation: cloud-drift 17s ease-in-out infinite alternate; }
    .cloud-two { animation-delay: -8s; }
    .wind-one { animation: wind 2.5s ease-in-out infinite; }
    .wind-two { animation: wind 2.5s ease-in-out -1.3s infinite; }
    .bird { animation: bird-float 3s ease-in-out infinite; }
    .bird-two { animation-delay: -1.6s; }
    .shadow { transform-origin: 524px 505px; animation: shadow-pulse var(--lap) ease-in-out infinite; }
    .paused .scene * { animation-play-state: paused !important; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 19px; }
    .caption { margin: 0; font-size: 12px; color: var(--muted); letter-spacing: .025em; line-height: 1.8; }
    .caption strong { color: var(--ink); font-weight: 500; }
    .controls { display: flex; align-items: center; gap: 21px; flex-shrink: 0; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 42px; border: 1px solid #243b3a38; border-radius: 30px; background: #fff9ed88; padding: 10px 17px; color: var(--ink); font-size: 12px; cursor: pointer; }
    button:hover { background: #fffaf2; border-color: var(--ink); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--orange); outline-offset: 5px; }
    .button-icon { width: 12px; height: 12px; display: inline-block; background: linear-gradient(to right, currentColor 0 30%, transparent 30% 70%, currentColor 70% 100%); }
    .paused .button-icon { background: currentColor; clip-path: polygon(12% 0, 100% 50%, 12% 100%); }
    .speed { display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--muted); }
    input[type="range"] { width: 76px; accent-color: var(--orange); cursor: pointer; }
    output { min-width: 28px; font-variant-numeric: tabular-nums; }
    .bottom-note { display: flex; justify-content: space-between; margin-top: 34px; padding-top: 13px; border-top: 1px solid #243b3a20; font: 9px "Trebuchet MS", sans-serif; letter-spacing: .2em; color: #7b8478; }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(2px); } 50% { transform: translateY(-1.5px); } }
    @keyframes flutter { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes wing-rock { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1.5deg); } }
    @keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
    @keyframes scenery { to { transform: translateX(-1000px); } }
    @keyframes cloud-drift { to { transform: translateX(-35px); } }
    @keyframes wind { 0% { opacity: 0; transform: translateX(25px); } 35% { opacity: .7; } 100% { opacity: 0; transform: translateX(-65px); } }
    @keyframes bird-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes shadow-pulse { 0%, 50%, 100% { transform: scaleX(1); opacity: .16; } 25%, 75% { transform: scaleX(.98); opacity: .13; } }
    @media (max-width: 640px) {
      body { padding: 28px 18px 20px; }
      header { margin-bottom: 20px; gap: 12px; }
      h1 span { margin-left: 4px; }
      .edition { font-size: 8px; }
      .eyebrow { font-size: 9px; letter-spacing: .16em; }
      .scene { width: 145%; max-width: none; margin-left: -22.5%; }
      footer { align-items: flex-start; flex-direction: column; gap: 14px; }
      .controls { width: 100%; justify-content: space-between; }
      .bottom-note { margin-top: 25px; font-size: 8px; letter-spacing: .12em; }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene * { animation-play-state: paused; }
      .motion-enabled .scene * { animation-play-state: running; }
      .paused .scene * { animation-play-state: paused !important; }
    }
  </style>
</head>

          <path d="M433 316Q430 310 440 307L475 307Q488 309 482 315Q460 321 433 316Z" fill="#39473d" stroke="#243b3a" stroke-width="3"/>

          <circle cx="383" cy="426" r="6" fill="#f5e7c9" stroke="#243b3a" stroke-width="3"/>
          <circle cx="677" cy="426" r="6" fill="#f5e7c9" stroke="#243b3a" stroke-width="3"/>
          <circle cx="514" cy="426" r="16" fill="#8ca18c" stroke="#243b3a" stroke-width="3"/>

    <footer>

      <div class="controls">

        <label class="speed" for="speed">Pace <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="Cycling speed"><output id="speed-value" for="speed">1×</output></label>

  <script>
    (() => {
      const card = document.getElementById('postcard');
      const toggle = document.getElementById('toggle');
      const label = document.getElementById('toggle-label');
      const slider = document.getElementById('speed');
      const speedValue = document.getElementById('speed-value');
      const nearLeg = document.getElementById('near-leg');
      const nearLegColor = document.getElementById('near-leg-color');
      const farLeg = document.getElementById('far-leg');
      const nearFoot = document.getElementById('near-foot');
      const farFoot = document.getElementById('far-foot');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const animations = card.getAnimations({ subtree: true });
      const crankAnimation = document.querySelector('.crank').getAnimations()[0];
      let paused = motionPreference.matches;
      let speed = 1;
      let lastTime = null;
      let elapsed = 0;

      function setPaused(value) {
        paused = value;
        card.classList.toggle('paused', paused);
        card.classList.toggle('motion-enabled', !paused);
        toggle.setAttribute('aria-pressed', String(paused));
        toggle.setAttribute('aria-label', paused ? 'Resume animation' : 'Pause animation');
        label.textContent = paused ? 'Keep riding' : 'Take a break';
        for (const animation of animations) {
          if (paused) animation.pause();
          else animation.play();
        }
      }

      // Two-link inverse kinematics keeps each webbed foot on its pedal.
      function legPose(hipX, hipY, footX, footY, upper, lower) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.max(.001, Math.hypot(dx, dy));
        const reach = Math.min(distance, upper + lower - .001);
        const along = (upper * upper - lower * lower + reach * reach) / (2 * reach);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + bend * dy / distance;
        const kneeY = hipY + along * dy / distance - bend * dx / distance;
        return `M${hipX.toFixed(2)} ${hipY.toFixed(2)}L${kneeX.toFixed(2)} ${kneeY.toFixed(2)}L${footX.toFixed(2)} ${footY.toFixed(2)}`;
      }

      function drawLegs(time) {
        const phase = time / 1350 * Math.PI * 2;
        const angle = phase + Math.PI / 4;
        const radius = Math.hypot(22, 22);
        const x = 514 + Math.cos(angle) * radius;
        const y = 426 + Math.sin(angle) * radius;
        const farX = 1028 - x;
        const farY = 852 - y;
        const bob = Math.sin(phase * 2) * 1.3;
        const path = legPose(481, 317 + bob, x, y, 72, 78);
        nearLeg.setAttribute('d', path);
        nearLegColor.setAttribute('d', path);
        farLeg.setAttribute('d', legPose(457, 316 + bob, farX, farY, 82, 79));
        nearFoot.setAttribute('transform', `translate(${x.toFixed(2)} ${(y - 13).toFixed(2)})`);
        farFoot.setAttribute('transform', `translate(${farX.toFixed(2)} ${(farY - 7).toFixed(2)})`);
      }

      function tick(now) {
        if (lastTime === null) lastTime = now;
        if (!paused) elapsed += Math.min(now - lastTime, 80) * speed;
        lastTime = now;
        // Read the crank timeline so feet and crank remain aligned after pause or speed changes.
        const time = crankAnimation && typeof crankAnimation.currentTime === 'number'
          ? crankAnimation.currentTime : elapsed;
        drawLegs(time);
        requestAnimationFrame(tick);
      }

      toggle.addEventListener('click', () => setPaused(!paused));
      slider.addEventListener('input', () => {
        speed = Number(slider.value);
        speedValue.value = `${speed}×`;
        for (const animation of animations) animation.updatePlaybackRate(speed);
      });
      motionPreference.addEventListener('change', event => setPaused(event.matches));
      document.addEventListener('visibilitychange', () => { lastTime = null; });
      setPaused(paused);
      drawLegs(0);
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
