<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelican on a Bicycle</title>
    <style>
      :root {
        --sky-top: #7ac2ff;
        --sky-bottom: #d3ecff;
        --road: #2e2e2e;
        --bike: #ffca28;
        --bike-dark: #e09a00;
        --body: #f4a261;
        --accent: #264653;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      }

      .frame {
        width: min(960px, 100vw);
        height: min(560px, 100vh);
        background: #ffffff44;
        border-radius: 20px;
        box-shadow: 0 20px 40px #00000035;
        overflow: hidden;
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      #biker {
        animation: rideMove 2.6s ease-in-out infinite alternate;
        transform-origin: center;
      }

      .wheel {
        animation: spin 1s linear infinite;
        transform-origin: center;
      }

      .pelican {
        animation: bob 0.5s ease-in-out infinite;
      }

      .wing {
        animation: flap 0.25s ease-in-out infinite alternate;
        transform-origin: center;
      }

      .tail {
        animation: tail 0.45s ease-in-out infinite alternate;
        transform-origin: center;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes rideMove {
        0% { transform: translateX(0px); }
        100% { transform: translateX(24px); }
      }

      @keyframes bob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }

      @keyframes flap {
        from { transform: rotate(-12deg); }
        to { transform: rotate(10deg); }
      }

      @keyframes tail {
        from { transform: rotate(-12deg); }
        to { transform: rotate(18deg); }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fff6a6" />
            <stop offset="100%" stop-color="#f6c56c" stop-opacity="0.4" />
          </radialGradient>
        </defs>

        <rect x="0" y="0" width="960" height="360" fill="url(#sunGlow)" />
        <g id="clouds" fill="#ffffffc9">
          <ellipse cx="140" cy="100" rx="60" ry="22" />
          <ellipse cx="178" cy="95" rx="40" ry="20" />
          <ellipse cx="216" cy="100" rx="55" ry="22" />
          <ellipse cx="740" cy="72" rx="52" ry="20" />
          <ellipse cx="780" cy="68" rx="40" ry="18" />
          <ellipse cx="815" cy="74" rx="48" ry="20" />
        </g>
        <rect x="0" y="360" width="960" height="180" fill="var(--road)" />
        <line x1="0" y1="430" x2="960" y2="430" stroke="#f0f0f0" stroke-width="4" />
        <line x1="0" y1="470" x2="960" y2="470" stroke="#fafafa" stroke-width="2" stroke-dasharray="8 12" />

        <g id="biker" transform="translate(180 252)">
          <!-- Bike frame -->
          <g transform="translate(200 120)">
            <line x1="180" y1="88" x2="250" y2="88" stroke="var(--bike-dark)" stroke-width="10" stroke-linecap="round" />
            <line x1="180" y1="88" x2="180" y2="178" stroke="var(--bike-dark)" stroke-width="9" stroke-linecap="round" />
            <line x1="250" y1="88" x2="250" y2="178" stroke="var(--bike-dark)" stroke-width="9" stroke-linecap="round" />
            <line x1="180" y1="178" x2="250" y2="178" stroke="var(--bike-dark)" stroke-width="9" stroke-linecap="round" />
            <line x1="180" y1="88" x2="120" y2="128" stroke="var(--bike-dark)" stroke-width="8" stroke-linecap="round" />
            <line x1="250" y1="88" x2="300" y2="132" stroke="var(--bike-dark)" stroke-width="8" stroke-linecap="round" />
            <line x1="120" y1="128" x2="170" y2="178" stroke="var(--bike-dark)" stroke-width="7" stroke-linecap="round" />
            <line x1="300" y1="132" x2="250" y2="178" stroke="var(--bike-dark)" stroke-width="7" stroke-linecap="round" />
            <circle cx="250" cy="178" r="10" fill="var(--accent)" />

            <!-- Wheels -->
            <g class="wheel" transform="translate(180 178)">
              <circle r="58" cx="0" cy="0" fill="#fcfcfc" stroke="#111" stroke-width="6" />
              <circle r="46" cx="0" cy="0" fill="none" stroke="#ccc" stroke-width="4" />
              <g stroke="#333" stroke-width="3">
                <line x1="0" y1="-46" x2="0" y2="46" />
                <line x1="-46" y1="0" x2="46" y2="0" />
                <line x1="-32" y1="-32" x2="32" y2="32" />
                <line x1="-32" y1="32" x2="32" y2="-32" />
              </g>
              <circle r="8" cx="0" cy="0" fill="#111" />
            </g>

            <g class="wheel" transform="translate(250 178)">
              <circle r="58" cx="0" cy="0" fill="#fcfcfc" stroke="#111" stroke-width="6" />
              <circle r="46" cx="0" cy="0" fill="none" stroke="#ccc" stroke-width="4" />
              <g stroke="#333" stroke-width="3">
                <line x1="0" y1="-46" x2="0" y2="46" />
                <line x1="-46" y1="0" x2="46" y2="0" />
                <line x1="-32" y1="-32" x2="32" y2="32" />
                <line x1="-32" y1="32" x2="32" y2="-32" />
              </g>
              <circle r="8" cx="0" cy="0" fill="#111" />
            </g>

            <!-- Crank and pedals -->
            <line x1="180" y1="178" x2="215" y2="210" stroke="#6f4e37" stroke-width="7" stroke-linecap="round" />
            <line x1="250" y1="178" x2="250" y2="210" stroke="#6f4e37" stroke-width="6" stroke-linecap="round" />
            <circle cx="250" cy="210" r="8" fill="#7a5230" />
            <rect x="207" y="205" width="18" height="11" rx="3" fill="#b07a38" />
            <rect x="238" y="204" width="18" height="11" rx="3" fill="#b07a38" />

            <!-- Handlebar -->
            <line x1="245" y1="64" x2="290" y2="36" stroke="#c77d35" stroke-width="8" stroke-linecap="round" />
            <line x1="290" y1="36" x2="310" y2="28" stroke="#c77d35" stroke-width="8" stroke-linecap="round" />
            <circle cx="310" cy="28" r="8" fill="#c77d35" />
          </g>

          <!-- Rider: pelican -->
          <g class="pelican" transform="translate(350 235)">
            <g transform="translate(10 -2)">
              <!-- body -->
              <ellipse cx="0" cy="0" rx="38" ry="18" fill="var(--body)" />
              <ellipse cx="8" cy="0" rx="26" ry="16" fill="#edb88f" />
              <ellipse cx="-25" cy="-3" rx="7" ry="10" fill="#e09b69" />
              <!-- head -->
              <g transform="translate(32 -22)">
                <ellipse cx="0" cy="0" rx="14" ry="12" fill="#f6d5b3" />
                <circle cx="7" cy="-2" r="1.8" fill="#111" />
                <ellipse cx="6" cy="-2" rx="5" ry="2.4" fill="#fff" fill-opacity="0.7" />
                <polygon points="14,-2 30,0 14,2" fill="#ed8f26" />
              </g>

              <!-- beak -->
              <path d="M34 -19 L58 -18 L47 -6 Z" fill="#f3a14d" stroke="#d87f2f" stroke-width="1.2" />

              <!-- wing + back -->
              <g class="wing" transform="translate(-38, -10)">
                <ellipse cx="0" cy="0" rx="24" ry="8" fill="#e3b08c" />
                <ellipse cx="-12" cy="1" rx="12" ry="5" fill="#d79e76" />
              </g>
              <g class="tail" transform="translate(-32, 8)">
                <ellipse cx="0" cy="0" rx="14" ry="7" fill="#e09f6e" />
              </g>

              <!-- legs -->
              <path d="M-10 16 C-2 46 34 30 26 56" fill="none" stroke="#e6a06f" stroke-width="6" stroke-linecap="round" />
              <path d="M8 16 C16 46 54 36 44 58" fill="none" stroke="#e6a06f" stroke-width="6" stroke-linecap="round" />
              <line x1="30" y1="58" x2="44" y2="70" stroke="#d48a57" stroke-width="6" stroke-linecap="round" />
            </g>
          </g>

          <!-- Saddle and pedals interaction -->
          <rect x="365" y="302" width="44" height="10" rx="4" fill="#654321" />
          <rect x="352" y="293" width="12" height="12" rx="6" fill="#3f3f3f" />
          <line x1="355" y1="299" x2="366" y2="299" stroke="#666" stroke-width="3" />
        </g>

        <text x="20" y="515" fill="#fff" font-size="20" opacity="0.9">
          Animated SVG: Pelican Cycling
        </text>
      </svg>
    </div>
  </body>
</html>
