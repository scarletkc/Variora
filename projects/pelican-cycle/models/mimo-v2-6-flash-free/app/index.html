<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 28px 16px;
    background: radial-gradient(1200px 700px at 50% 0%, #22304a 0%, #0d1117 70%);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    color: #e6edf3;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(22px, 3.4vw, 34px);
    font-weight: 700;
    letter-spacing: .18em;
  }
  h1 span { color: #ffd24a; }
  .card {
    width: min(960px, 96vw);
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  svg.scene { display: block; width: 100%; height: auto; }
  .note {
    margin: 0;
    max-width: 760px;
    font-size: 13.5px;
    line-height: 1.8;
    color: #9aa7b8;
  }
  .note b { color: #c9d6e6; font-weight: 600; }

  /* ---------- 场景滚动（视差） ---------- */
  @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  .sc { animation-name: scrollX; animation-timing-function: linear; animation-iteration-count: infinite; }
  .s-clouds  { animation-duration: 46s; }
  .s-hillFar { animation-duration: 38s; }
  .s-hillNear{ animation-duration: 26s; }
  .s-trees   { animation-duration: 2s; }
  .s-tufts   { animation-duration: 1.3s; }
  .s-dash    { animation-duration: 1.25s; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .sun-rays {
    transform-origin: 150px 95px;
    animation: spin 70s linear infinite;
  }

  /* ---------- 速度线 ---------- */
  @keyframes zip {
    0%   { transform: translateX(90px);  opacity: 0; }
    12%  { opacity: .8; }
    70%  { opacity: .5; }
    100% { transform: translateX(-430px); opacity: 0; }
  }
  .zip { animation: zip .7s linear infinite; }

  /* ---------- 鹈鹕小动作 ---------- */
  @keyframes nod {
    0%, 100% { transform: rotate(-1.4deg); }
    50%      { transform: rotate(1.6deg); }
  }
  #headG {
    transform-origin: 458px 196px;
    animation: nod 1.4s ease-in-out infinite;
  }
  @keyframes bag {
    0%, 100% { transform: scaleY(1) rotate(0deg); }
    50%      { transform: scaleY(1.07) rotate(1.6deg); }
  }
  #pouchG {
    transform-origin: 478px 186px;
    animation: bag 1.4s ease-in-out infinite;
  }
  @keyframes wag {
    0%, 100% { transform: rotate(-3.5deg); }
    50%      { transform: rotate(3.5deg); }
  }
  #tailG {
    transform-origin: 364px 252px;
    animation: wag .9s ease-in-out infinite;
  }
  @keyframes flap {
    0%, 100% { transform: rotate(-1.6deg); }
    50%      { transform: rotate(1.6deg); }
  }
  #wingNear {
    transform-origin: 414px 212px;
    animation: flap 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 93%, 100% { transform: scaleY(1); }
    96%           { transform: scaleY(.08); }
  }
  #eyeG {
    transform-origin: 472px 163px;
    animation: blink 4.2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .sc, .sun-rays, .zip, #headG, #pouchG, #tailG, #wingNear, #eyeG { animation: none !important; }
  }
</style>
</head>
<body>

</div>

<p class="note">
  <b>纯 SVG</b> 绘制的角色与场景 · <b>CSS</b> 驱动云层/山峦/草丛/车道线的视差滚动、太阳旋转与鹈鹕点头、抖喉囊、眨眼、摆尾、扇翅 ·
  <b>JavaScript</b> 每帧计算踩踏的两骨骼逆运动学（IK），让双腿准确踩在脚踏上，并同步车轮转速与车身颠簸。
</p>

<script>
(function () {
  // ---- 关键几何 ----
  var HIP  = { x: 378, y: 268 };   // 髋关节（坐在车座上）
  var BB   = { x: 442, y: 400 };   // 中轴（曲柄中心）
  var CR   = 30;                   // 曲柄长度
  var L1   = 95;                   // 大腿
  var L2   = 90;                   // 小腿

  var $ = function (id) { return document.getElementById(id); };
  var rig        = $('rig');
  var spokesR    = $('spokesR'), spokesF = $('spokesF');
  var crankNear  = $('crankNear'), crankFar = $('crankFar');
  var pedalNear  = $('pedalNear'), pedalFar = $('pedalFar');
  var legNear    = $('legNear'), legNearOut = $('legNearOut');
  var legFar     = $('legFar'),  legFarOut  = $('legFarOut');
  var footNear   = $('footNear'), footFar   = $('footFar');

  // 两骨骼 IK：膝盖朝前（x 更大的一侧）
  function legIK(theta) {
    var fx = BB.x + CR * Math.cos(theta);
    var fy = BB.y + CR * Math.sin(theta);
    var dx = fx - HIP.x, dy = fy - HIP.y;
    var d  = Math.sqrt(dx * dx + dy * dy);
    var max = L1 + L2 - 1, min = Math.abs(L1 - L2) + 1;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    else if (d < min) { dx *= min / d; dy *= min / d; d = min; }

    var a = Math.atan2(dy, dx);
    var c = (d * d + L1 * L1 - L2 * L2) / (2 * d * L1);
    c = c > 1 ? 1 : (c < -1 ? -1 : c);
    var al = Math.acos(c);

    var k1x = HIP.x + L1 * Math.cos(a - al), k1y = HIP.y + L1 * Math.sin(a - al);
    var k2x = HIP.x + L1 * Math.cos(a + al), k2y = HIP.y + L1 * Math.sin(a + al);
    var use1 = k1x >= k2x;
    return { fx: fx, fy: fy, kx: use1 ? k1x : k2x, ky: use1 ? k1y : k2y };
  }

  function drawLeg(out, main, foot, theta) {
    var s = legIK(theta);
    var d = 'M ' + HIP.x + ' ' + HIP.y +
            ' L ' + s.kx.toFixed(1) + ' ' + s.ky.toFixed(1) +
            ' L ' + s.fx.toFixed(1) + ' ' + s.fy.toFixed(1);
    out.setAttribute('d', d);
    main.setAttribute('d', d);
    foot.setAttribute('transform',
      'translate(' + s.fx.toFixed(1) + ' ' + s.fy.toFixed(1) + ')');
    return s;
  }

  var theta = 1.2;
  var CAD   = (2 * Math.PI) / 1.2;  // 踩踏：1.2 秒 / 圈
  var RATIO = 1.9;                  // 齿比：车轮转速 = 曲柄 × 1.9
  var last  = 0;

  function render() {
    var deg  = theta * 180 / Math.PI;
    var wdeg = deg * RATIO;

    // 车轮辐条
    spokesR.setAttribute('transform', 'translate(330 395) rotate(' + wdeg.toFixed(1) + ')');
    spokesF.setAttribute('transform', 'translate(560 395) rotate(' + wdeg.toFixed(1) + ')');

    // 曲柄 / 齿盘
    var cr = 'rotate(' + deg.toFixed(1) + ' 442 400)';
    crankNear.setAttribute('transform', cr);
    crankFar.setAttribute('transform', cr);

    // 两腿（相位相差 180°）
    var n = drawLeg(legNearOut, legNear, footNear, theta);
    var f = drawLeg(legFarOut,  legFar,  footFar,  theta + Math.PI);

    // 脚踏保持水平
    pedalNear.setAttribute('transform',
      'translate(' + n.fx.toFixed(1) + ' ' + (n.fy + 4).toFixed(1) + ')');
    pedalFar.setAttribute('transform',
      'translate(' + f.fx.toFixed(1) + ' ' + (f.fy + 4).toFixed(1) + ')');

    // 车身轻微颠簸 + 俯仰
    var bob  = Math.sin(2 * theta) * 2.0;
    var tilt = Math.sin(2 * theta + 0.6) * 0.35;
    rig.setAttribute('transform',
      'translate(0 ' + bob.toFixed(2) + ') rotate(' + tilt.toFixed(2) + ' 450 467)');
  }

  function tick(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    theta += dt * CAD;
    if (theta > Math.PI * 2000) theta -= Math.PI * 2000;
    render();
    requestAnimationFrame(tick);
  }

  var reduce = window.matchMedia &&
               window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) {
    render();
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>
</body>
</html>
