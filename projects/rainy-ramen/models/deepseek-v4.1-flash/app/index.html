<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainy Ramen — a cat, a small robot, and one bowl of noodles</title>
<style>
  :root{
    --bg:#04060c;
    --ink:#e8f1ff;
    --muted:#8fa3bd;
    --line:rgba(150,190,255,.16);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#04060c;
    background-image:radial-gradient(130% 85% at 50% 44%, #121d33 0%, #080d18 52%, #04060c 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .stage{position:fixed;inset:0;display:grid;place-items:center}
  svg#scene{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;left:clamp(16px,3vw,40px);bottom:clamp(16px,3vw,40px);
    z-index:5;pointer-events:none;
  }
  .card{
    max-width:min(360px,72vw);
    padding:14px 18px 15px;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(180deg,rgba(9,14,26,.72),rgba(6,9,17,.62));
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 18px 40px -22px rgba(0,0,0,.95);
  }
  .eyebrow{
    margin:0 0 6px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--muted);
  }
  .card h1{
    margin:0;font-size:19px;font-weight:650;letter-spacing:.01em;
  }
  .card p.sub{
    margin:7px 0 0;font-size:12.5px;line-height:1.5;color:var(--muted);
  }

  .sound{
    position:fixed;right:clamp(16px,3vw,40px);bottom:clamp(16px,3vw,40px);
    z-index:5;display:inline-flex;align-items:center;gap:9px;
    padding:10px 15px 10px 13px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(9,14,26,.78),rgba(6,9,17,.66));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    color:var(--ink);font:inherit;font-size:12.5px;letter-spacing:.03em;
    transition:border-color .25s,color .25s,transform .25s;
  }
  .sound:hover{border-color:rgba(180,215,255,.42);transform:translateY(-1px)}
  .sound:focus-visible{outline:2px solid #6fe3ff;outline-offset:3px}
  .sound svg{width:15px;height:15px;flex:none}
  .sound .on{display:none}
  .sound[aria-pressed="true"]{border-color:rgba(255,110,170,.5);color:#ffd9ea}
  .sound[aria-pressed="true"] .on{display:block}
  .sound[aria-pressed="true"] .off{display:none}
  .sound[aria-pressed="true"] .label::after{content:"on"}
  .sound .label::after{content:"off"}

  /* ---------- Animation ---------- */
  .rain-rect{will-change:transform}
  .rain-a{animation:fallA 1.15s linear infinite}
  .rain-b{animation:fallB 1.75s linear infinite}
  .rain-c{animation:fallC .82s linear infinite}
  @keyframes fallA{from{transform:translateY(0)}to{transform:translateY(400px)}}
  @keyframes fallB{from{transform:translateY(0)}to{transform:translateY(600px)}}
  @keyframes fallC{from{transform:translateY(0)}to{transform:translateY(300px)}}

  .sway{transform-box:fill-box;transform-origin:50% 0%;animation:sway 5.4s ease-in-out infinite}
  .sway-b{animation-duration:6.8s;animation-delay:-2.1s}
  @keyframes sway{
    0%,100%{transform:rotate(-2.4deg)}
    50%{transform:rotate(2.4deg)}
  }

  .flicker{animation:flicker 3.4s steps(1,end) infinite}
  .flicker-b{animation-duration:4.9s;animation-delay:-1.6s}
  .flicker-c{animation-duration:6.2s;animation-delay:-3.3s}
  @keyframes flicker{
    0%,7%,9%,11%,54%,56%,100%{opacity:1}
    8%,10%{opacity:.32}
    55%{opacity:.55}
    78%{opacity:.86}
  }

  .glow-breathe{animation:breathe 6.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
  @keyframes breathe{
    0%,100%{opacity:.62;transform:scale(1)}
    50%{opacity:.92;transform:scale(1.035)}
  }

  .cat-breathe{transform-box:fill-box;transform-origin:50% 100%;animation:catBreathe 4.2s ease-in-out infinite}
  @keyframes catBreathe{
    0%,100%{transform:scaleY(1) translateY(0)}
    50%{transform:scaleY(1.018) translateY(-1.5px)}
  }

  .blink{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.6s ease-in-out infinite}
  @keyframes blink{
    0%,92%,100%{transform:scaleY(1)}
    95%{transform:scaleY(.08)}
    97%{transform:scaleY(1)}
  }

  .tail{transform-box:fill-box;transform-origin:100% 100%;animation:tail 3.6s ease-in-out infinite}
  @keyframes tail{
    0%,100%{transform:rotate(-3deg)}
    50%{transform:rotate(5deg)}
  }

  .robot-bob{animation:bob 3.1s ease-in-out infinite}
  @keyframes bob{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-3.5px)}
  }

  .umbrella-sway{transform-box:fill-box;transform-origin:88% 100%;animation:umb 6.4s ease-in-out infinite}
  @keyframes umb{
    0%,100%{transform:rotate(-1.6deg)}
    50%{transform:rotate(1.6deg)}
  }

  .visor{animation:visor 4.4s ease-in-out infinite}
  @keyframes visor{
    0%,100%{opacity:1}
    47%{opacity:1}
    50%{opacity:.25}
    53%{opacity:1}
  }

  .steam{opacity:0;animation:steam 4.6s ease-out infinite}
  .steam-b{animation-duration:5.6s;animation-delay:-1.7s}
  .steam-c{animation-duration:4.1s;animation-delay:-3.1s}
  @keyframes steam{
    0%{opacity:0;transform:translateY(14px) scale(.72)}
    18%{opacity:.5}
    62%{opacity:.26}
    100%{opacity:0;transform:translateY(-72px) scale(1.5)}
  }

  .ripple{transform-box:fill-box;transform-origin:50% 50%;animation:ripple 2.6s ease-out infinite}
  @keyframes ripple{
    0%{transform:scale(.12);opacity:0}
    12%{opacity:.75}
    100%{transform:scale(1);opacity:0}
  }

  .splash{transform-box:fill-box;transform-origin:50% 50%;animation:splash 1.15s linear infinite}
  @keyframes splash{
    0%{transform:scale(.15);opacity:0}
    10%{opacity:.85}
    100%{transform:scale(1.9);opacity:0}
  }

  .drip{animation:drip 3.4s cubic-bezier(.42,.02,.86,.5) infinite}
  @keyframes drip{
    0%{transform:translateY(0);opacity:0}
    12%{opacity:.9}
    72%{opacity:.9}
    100%{transform:translateY(62px);opacity:0}
  }

  .shimmer{animation:shimmer 7.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
  .shimmer-b{animation-duration:9.5s;animation-delay:-3s}
  @keyframes shimmer{
    0%,100%{transform:scaleX(1) translateX(0);opacity:.55}
    50%{transform:scaleX(1.08) translateX(6px);opacity:.8}
  }

  .mist{animation:mist 14s ease-in-out infinite alternate}
  @keyframes mist{
    from{transform:translateX(-22px);opacity:.5}
    to{transform:translateX(26px);opacity:.78}
  }

  .lamp-swing{transform-box:fill-box;transform-origin:50% 0%;animation:lampSwing 5.9s ease-in-out infinite}
  .lamp-swing-b{animation-duration:7.3s;animation-delay:-2.6s}
  @keyframes lampSwing{
    0%,100%{transform:rotate(-1.5deg)}
    50%{transform:rotate(1.5deg)}
  }

  @media (max-width:760px), (max-height:560px){
    .card{max-width:60vw;padding:10px 13px 11px;border-radius:12px}
    .card h1{font-size:15px}
    .card .eyebrow{font-size:9px;letter-spacing:.18em;margin-bottom:4px}
    .card p.sub{display:none}
    .sound{padding:8px 12px;font-size:11.5px}
  }
  @media (max-width:520px){
    .card{max-width:none;left:0;right:0}
    .hud{left:12px;right:12px;bottom:12px}
    .sound{bottom:74px}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important}
    .steam{opacity:.34}
  }
</style>
</head>
<body>

<div class="stage">
<svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="sceneTitle sceneDesc">
  <title id="sceneTitle">Rainy Ramen</title>
  <desc id="sceneDesc">On a rainy neon night, a cat chef in a ramen shop hands a steaming bowl of
  ramen across the counter to a small robot who is holding a transparent umbrella.</desc>

  <defs>
    <!-- ============ gradients ============ -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#04060d"/>
      <stop offset="38%"  stop-color="#0a1120"/>
      <stop offset="72%"  stop-color="#16223a"/>
      <stop offset="100%" stop-color="#26364f"/>
    </linearGradient>

    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#182238"/>
      <stop offset="26%"  stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>

    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2e211b"/>
      <stop offset="100%" stop-color="#170f0c"/>
    </linearGradient>

    <radialGradient id="interior" cx="46%" cy="66%" r="66%">
      <stop offset="0%"   stop-color="#ffe0ae"/>
      <stop offset="28%"  stop-color="#f0b269"/>
      <stop offset="60%"  stop-color="#9c5f2c"/>
      <stop offset="100%" stop-color="#331c10"/>
    </radialGradient>

    <radialGradient id="lantern" cx="36%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#ffe2b4"/>
      <stop offset="30%"  stop-color="#ff8a4e"/>
      <stop offset="72%"  stop-color="#d3371f"/>
      <stop offset="100%" stop-color="#8d1a12"/>
    </radialGradient>

    <linearGradient id="glass" x1=".08" y1="0" x2=".92" y2="1">
      <stop offset="0%"   stop-color="#e6f8ff" stop-opacity=".42"/>
      <stop offset="38%"  stop-color="#9fdcff" stop-opacity=".13"/>
      <stop offset="72%"  stop-color="#8ad2ff" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#bdeaff" stop-opacity=".34"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0%"   stop-color="#f0f5fb"/>
      <stop offset="42%"  stop-color="#adbbcb"/>
      <stop offset="100%" stop-color="#5f6e81"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="0" y1="0" x2=".7" y2="1">
      <stop offset="0%"   stop-color="#8e9dae"/>
      <stop offset="100%" stop-color="#42505f"/>
    </linearGradient>

    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fdf2df"/>
      <stop offset="100%" stop-color="#e6cca6"/>
    </linearGradient>

    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2b3b64"/>
      <stop offset="100%" stop-color="#151f3a"/>
    </linearGradient>

    <linearGradient id="broth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6c169"/>
      <stop offset="100%" stop-color="#c98a2e"/>
    </linearGradient>

    <linearGradient id="bowlRed" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0%"   stop-color="#e8604a"/>
      <stop offset="45%"  stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#7d1f16"/>
    </linearGradient>

    <!-- reflection streaks -->
    <linearGradient id="reflWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffc478" stop-opacity=".92"/>
      <stop offset="42%"  stop-color="#ff9a3c" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#ff8a2c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff6a50" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff3a24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff5aa8" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#ff2e88" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="reflCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7cefff" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#22c8ee" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="poolWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffd193" stop-opacity=".85"/>
      <stop offset="48%"  stop-color="#ff9c3e" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ff8a2c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="poolCold" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#b6ecff" stop-opacity=".44"/>
      <stop offset="100%" stop-color="#4fc8f0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vig" cx="50%" cy="40%" r="84%">
      <stop offset="46%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000208" stop-opacity=".7"/>
    </radialGradient>

    <linearGradient id="streetSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5f8fc4" stop-opacity=".16"/>
      <stop offset="45%"  stop-color="#3d6390" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#1d3352" stop-opacity=".03"/>
    </linearGradient>

    <radialGradient id="hazeWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffb055" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>

    <!-- ============ filters ============ -->
    <filter id="glowS" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="glowM" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowL" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="wetBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5 1.8"/>
    </filter>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="farBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <!-- keeps the cat's markings inside the head -->
    <clipPath id="catHeadClip">
      <ellipse cx="510" cy="476" rx="56" ry="49"/>
    </clipPath>

    <!-- ============ rain patterns ============ -->
    <pattern id="rainA" width="180" height="400" patternUnits="userSpaceOnUse">
      <g stroke="#cfe8ff" stroke-width="1.4" stroke-linecap="round" opacity=".3">
        <line x1="18"  y1="22"  x2="4"   y2="94"/>
        <line x1="56"  y1="66"  x2="42"  y2="138"/>
        <line x1="100" y1="10"  x2="86"  y2="82"/>
        <line x1="138" y1="94"  x2="124" y2="166"/>
        <line x1="172" y1="42"  x2="158" y2="114"/>
        <line x1="34"  y1="152" x2="20"  y2="224"/>
        <line x1="78"  y1="198" x2="64"  y2="270"/>
        <line x1="122" y1="144" x2="108" y2="216"/>
        <line x1="162" y1="212" x2="148" y2="284"/>
        <line x1="12"  y1="254" x2="-2"  y2="326"/>
        <line x1="64"  y1="302" x2="50"  y2="374"/>
        <line x1="108" y1="270" x2="94"  y2="342"/>
        <line x1="150" y1="322" x2="136" y2="394"/>
        <line x1="26"  y1="314" x2="12"  y2="386"/>
        <line x1="92"  y1="290" x2="78"  y2="362"/>
        <line x1="176" y1="132" x2="162" y2="204"/>
      </g>
    </pattern>

    <pattern id="rainB" width="240" height="600" patternUnits="userSpaceOnUse">
      <g stroke="#bfe0ff" stroke-width="2" stroke-linecap="round" opacity=".36">
        <line x1="26"  y1="40"  x2="8"   y2="138"/>
        <line x1="88"  y1="128" x2="70"  y2="226"/>
        <line x1="150" y1="22"  x2="132" y2="120"/>
        <line x1="212" y1="176" x2="194" y2="274"/>
        <line x1="58"  y1="268" x2="40"  y2="366"/>
        <line x1="120" y1="352" x2="102" y2="450"/>
        <line x1="182" y1="240" x2="164" y2="338"/>
        <line x1="30"  y1="430" x2="12"  y2="528"/>
        <line x1="94"  y1="500" x2="76"  y2="598"/>
        <line x1="156" y1="446" x2="138" y2="544"/>
        <line x1="226" y1="392" x2="208" y2="490"/>
        <line x1="66"  y1="96"  x2="48"  y2="194"/>
        <line x1="196" y1="546" x2="178" y2="644"/>
        <line x1="16"  y1="182" x2="-2"  y2="280"/>
      </g>
    </pattern>

    <pattern id="rainC" width="120" height="300" patternUnits="userSpaceOnUse">
      <g stroke="#e6f4ff" stroke-width="1" stroke-linecap="round" opacity=".2">
        <line x1="14"  y1="16"  x2="5"   y2="64"/>
        <line x1="46"  y1="52"  x2="37"  y2="100"/>
        <line x1="78"  y1="8"   x2="69"  y2="56"/>
        <line x1="110" y1="72"  x2="101" y2="120"/>
        <line x1="30"  y1="118" x2="21"  y2="166"/>
        <line x1="62"  y1="156" x2="53"  y2="204"/>
        <line x1="96"  y1="134" x2="87"  y2="182"/>
        <line x1="20"  y1="206" x2="11"  y2="254"/>
        <line x1="56"  y1="240" x2="47"  y2="288"/>
        <line x1="88"  y1="200" x2="79"  y2="248"/>
        <line x1="112" y1="234" x2="103" y2="282"/>
        <line x1="40"  y1="86"  x2="31"  y2="134"/>
      </g>
    </pattern>
  </defs>

  <!-- ==================== 1. SKY ==================== -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#sky)"/>

  <!-- ==================== 2. FAR CITY ==================== -->
  <g id="city-far" opacity=".92">
    <g fill="#0a1020">
      <rect x="-40"  y="196" width="180" height="480"/>
      <rect x="96"   y="140" width="128" height="536"/>
      <rect x="196"  y="228" width="120" height="448"/>
      <rect x="330"  y="88"  width="86"  height="120"/>
      <rect x="424"  y="52"  width="54"  height="160"/>
      <rect x="672"  y="34"  width="72"  height="180"/>
      <rect x="742"  y="76"  width="58"  height="140"/>
      <rect x="880"  y="164" width="150" height="512"/>
      <rect x="1024" y="112" width="118" height="564"/>
      <rect x="1136" y="188" width="120" height="488"/>
    </g>
    <!-- antennas -->
    <g stroke="#0d1426" stroke-width="3">
      <line x1="152" y1="140" x2="152" y2="92"/>
      <line x1="450" y1="52"  x2="450" y2="12"/>
      <line x1="708" y1="34"  x2="708" y2="4"/>
      <line x1="1082" y1="112" x2="1082" y2="70"/>
    </g>
    <!-- lit windows, generated deterministically by script -->
    <g id="city-windows"></g>
  </g>

  <!-- far neon smears -->
  <g filter="url(#farBlur)" opacity=".55">
    <rect x="112" y="256" width="16" height="150" fill="#ff3f96"/>
    <rect x="1060" y="236" width="16" height="190" fill="#3fd8ff"/>
    <rect x="196" y="300" width="12" height="110" fill="#ffb24a"/>
  </g>

  <!-- ==================== 3. RAIN — far layer ==================== -->
  <g clip-path="none">
    <rect class="rain-rect rain-c" x="-200" y="-900" width="1600" height="2400" fill="url(#rainC)"/>
  </g>

  <!-- ==================== 4. NEIGHBOUR BUILDINGS ==================== -->
  <!-- left -->
  <g>
    <rect x="-40" y="150" width="340" height="520" fill="#111726"/>
    <rect x="-40" y="150" width="340" height="10" fill="#1b2437"/>
    <rect x="262" y="150" width="38"  height="520" fill="#0c111d"/>
    <!-- vertical neon sign -->
    <g>
      <rect x="126" y="196" width="86" height="290" rx="6" fill="#080b14" stroke="#222d44" stroke-width="2"/>
      <g class="flicker">
        <g filter="url(#glowM)" opacity=".95">
          <text x="169" y="248" font-family="'Yu Gothic','Meiryo','Hiragino Kaku Gothic ProN','Noto Sans JP','MS PGothic',sans-serif"
                font-size="42" font-weight="700" fill="#ff2e88" text-anchor="middle">居</text>
          <text x="169" y="308" font-family="'Yu Gothic','Meiryo','Hiragino Kaku Gothic ProN','Noto Sans JP','MS PGothic',sans-serif"
                font-size="42" font-weight="700" fill="#ff2e88" text-anchor="middle">酒</text>
          <text x="169" y="368" font-family="'Yu Gothic','Meiryo','Hiragino Kaku Gothic ProN','Noto Sans JP','MS PGothic',sans-serif"
                font-size="42" font-weight="700" fill="#ff2e88" text-anchor="middle">屋</text>
        </g>

      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };

    { x:96,   y:140, w:128, h:536 },
    { x:196,  y:228, w:120, h:448 },
    { x:330,  y:88,  w:86,  h:120 },
    { x:424,  y:52,  w:54,  h:160 },
    { x:672,  y:34,  w:72,  h:180 },
    { x:742,  y:76,  w:58,  h:140 },
    { x:880,  y:164, w:150, h:512 },
    { x:1024, y:112, w:118, h:564 },
    { x:1136, y:188, w:120, h:488 }
  ];
  const winGroup = document.getElementById("city-windows");
  towers.forEach(t => {
    const cols = Math.max(2, Math.floor(t.w / 22));
    const rows = Math.max(2, Math.floor(t.h / 26));
    for (let c = 0; c < cols; c++){
      for (let r = 0; r < rows; r++){
        if (rand() > .42) continue;
        const [fill, op] = pick(winColors);
        winGroup.appendChild(el("rect", {
          x: (t.x + 10 + c * 22).toFixed(1),
          y: (t.y + 14 + r * 26).toFixed(1),
          width: 9, height: 12, rx: 1.6,
          fill,
          opacity: (op * rnd(.75, 1.5)).toFixed(2)
        }));
      }
    }
  });

  /* ---------------------------------------------------------------
     2. Puddle ripples
  --------------------------------------------------------------- */
  const puddles = [
    { cx:196, cy:742, rx:152, ry:34, n:7 },
    { cx:470, cy:700, rx:120, ry:24, n:6 },
    { cx:912, cy:748, rx:176, ry:38, n:8 },
    { cx:628, cy:778, rx:210, ry:30, n:6 }
  ];
  const rippleGroup = document.getElementById("ripples");
  puddles.forEach(p => {
    for (let i = 0; i < p.n; i++){
      const t = rnd(-.75, .75);
      const c = el("ellipse", {
        cx: (p.cx + t * p.rx * .82).toFixed(1),
        cy: (p.cy + rnd(-.6, .6) * p.ry * .7).toFixed(1),
        rx: (rnd(14, 34)).toFixed(1),
        ry: (rnd(4, 9)).toFixed(1),
        opacity: 0
      });
      c.setAttribute("class", "ripple");
      c.style.animationDelay = (-rnd(0, 2.6)).toFixed(2) + "s";
      c.style.animationDuration = rnd(2.1, 3.4).toFixed(2) + "s";
      rippleGroup.appendChild(c);
    }
  });

  /* ---------------------------------------------------------------
     3. Ground splashes
  --------------------------------------------------------------- */
  const splashGroup = document.getElementById("splashes");
  for (let i = 0; i < 64; i++){
    const x = rnd(-10, 1210);
    const y = 664 + Math.pow(rand(), .72) * 134;      // denser near the shop
    const s = el("ellipse", {
      cx: x.toFixed(1), cy: y.toFixed(1),
      rx: (rnd(7, 15)).toFixed(1),
      ry: (rnd(2, 4.2)).toFixed(1),
      opacity: 0
    });
    s.setAttribute("class", "splash");
    s.style.animationDelay = (-rnd(0, 1.15)).toFixed(2) + "s";
    s.style.animationDuration = rnd(.9, 1.5).toFixed(2) + "s";
    s.setAttribute("stroke-width", rnd(1, 2).toFixed(2));
    splashGroup.appendChild(s);
  }

  /* ---------------------------------------------------------------
     4. Droplets sliding off the umbrella
  --------------------------------------------------------------- */
  const dripGroup = document.getElementById("drips");
  const dripSeeds = [
    { x:700, y:478, d:0.0 }, { x:742, y:458, d:1.1 },
    { x:784, y:436, d:0.6 }, { x:828, y:428, d:2.0 },
    { x:872, y:444, d:1.5 }, { x:912, y:470, d:2.6 },
    { x:762, y:470, d:0.4 }, { x:858, y:452, d:2.9 }
  ];
  dripSeeds.forEach(d => {
    const g = el("g", { class: "drip" });
    g.style.animationDelay = (-d.d).toFixed(2) + "s";
    g.appendChild(el("ellipse", {
      cx: d.x, cy: d.y, rx: 3.2, ry: 4.6, fill: "#e6f6ff", opacity: .95
    }));
    g.appendChild(el("ellipse", {
      cx: d.x - 1, cy: d.y - 1.4, rx: 1.2, ry: 1.6, fill: "#ffffff"
    }));
    dripGroup.appendChild(g);
  });

  /* ---------------------------------------------------------------
     5. Keep the whole illustration visible on narrow viewports,
        and fill the frame on wide ones.
  --------------------------------------------------------------- */
  const scene = document.getElementById("scene");
  function fit(){
    const a = window.innerWidth / window.innerHeight;
    scene.setAttribute("preserveAspectRatio",
      a < 1.16 ? "xMidYMid meet" : "xMidYMid slice");
  }
  fit();
  window.addEventListener("resize", fit);

  /* ---------------------------------------------------------------
     6. WebAudio rain — synthesised, no external assets.
        Brown-ish noise through a band-pass, a slow LFO for gusting,
        and a low rumble that swells occasionally like far-off thunder.
  --------------------------------------------------------------- */
  const btn = document.getElementById("sound");
  let audio = null;

  function buildRain(){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    const ctx = new Ctx();

    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    // --- noise source (brown noise: integrated white noise) ---
    const seconds = 6;
    const buffer = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < data.length; i++){
      const white = Math.random() * 2 - 1;
      last = (last + 0.021 * white) / 1.021;
      data[i] = last * 3.4;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    noise.loop = true;

    // --- shaping ---
    const highpass = ctx.createBiquadFilter();
    highpass.type = "highpass";
    highpass.frequency.value = 210;

    const lowpass = ctx.createBiquadFilter();
    lowpass.type = "lowpass";
    lowpass.frequency.value = 2400;
    lowpass.Q.value = 0.6;

    const rainGain = ctx.createGain();
    rainGain.gain.value = 0.62;

    noise.connect(highpass);
    highpass.connect(lowpass);
    lowpass.connect(rainGain);
    rainGain.connect(master);

    // --- gusting LFO ---
    const lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.068;
    const lfoDepth = ctx.createGain();
    lfoDepth.gain.value = 0.16;
    lfo.connect(lfoDepth);
    lfoDepth.connect(rainGain.gain);

    // --- a soft low bed so the rain has weight ---
    const bed = ctx.createOscillator();
    bed.type = "sine";
    bed.frequency.value = 46;
    const bedGain = ctx.createGain();
    bedGain.gain.value = 0.05;
    bed.connect(bedGain);
    bedGain.connect(master);

    noise.start();
    lfo.start();
    bed.start();

    // --- occasional distant thunder ---
    function thunder(){
      const t = ctx.currentTime;
      const dur = 4.5;
      const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++){
        const p = i / d.length;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - p, 2.4);
      }
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.setValueAtTime(320, t);
      lp.frequency.exponentialRampToValueAtTime(90, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.9);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(lp); lp.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur);
      timer = window.setTimeout(thunder, rnd(22000, 48000));
    }
    let timer = window.setTimeout(thunder, rnd(9000, 18000));

    return {
      ctx,
      fade(to, seconds){
        const now = ctx.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), now);
        master.gain.linearRampToValueAtTime(to, now + seconds);
      },
      stop(){
        window.clearTimeout(timer);
        try { noise.stop(); lfo.stop(); bed.stop(); } catch (_) {}
        ctx.close();
      }
    };
  }

  btn.addEventListener("click", () => {
    const on = btn.getAttribute("aria-pressed") === "true";
    if (on){
      btn.setAttribute("aria-pressed", "false");
      btn.setAttribute("aria-label", "Toggle rain ambience");
      if (audio) audio.fade(0, 0.9);
      return;
    }
    if (!audio) audio = buildRain();
    if (!audio) return;
    audio.ctx.resume && audio.ctx.resume();
    btn.setAttribute("aria-pressed", "true");
    btn.setAttribute("aria-label", "Turn rain ambience off");
    audio.fade(0.42, 2.4);
  });
})();
</script>
</body>
