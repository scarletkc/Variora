<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rainy Ramen</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1a1030;
      }

      body {
        display: grid;
        place-items: center;
      }

      svg {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      #rain-toggle {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 2;
        font: 15px/1 "Yu Gothic", "Segoe UI", sans-serif;
        color: #2a140c;
        background: #ffb15a;
        border: 0;
        padding: 10px 14px;
        cursor: pointer;
      }

      #rain-toggle:hover {
        background: #ffc27a;
      }

      #rain-toggle:focus-visible {
        outline: 2px solid #fff6ea;
        outline-offset: 3px;
      }

      .flicker {
        animation: flicker 3.4s infinite;
      }

      .flicker-late {
        animation: flicker 4.8s 1.2s infinite;
      }

      @keyframes flicker {
        0%,
        19%,
        23%,
        100% {
          opacity: 1;
        }
        21% {
          opacity: 0.45;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .flicker,
        .flicker-late {
          animation: none;
        }
      }
    </style>
  </head>
  <body>

    <script>
      (function () {
        var svg = document.querySelector("svg");
        var ns = "http://www.w3.org/2000/svg";
        var motion = window.matchMedia("(prefers-reduced-motion: reduce)");
        var drops = [];

        function makeDrop(parent, speed, alpha, width) {
          var line = document.createElementNS(ns, "line");
          var drop = {
            line: line,
            x: Math.random() * 1240 - 20,
            y: Math.random() * 720 - 40,
            len: 14 + Math.random() * 20,
            v: speed + Math.random() * 3.5,
          };
          line.setAttribute("stroke", "rgba(198, 222, 242, " + alpha + ")");
          line.setAttribute("stroke-width", String(width));
          line.setAttribute("stroke-linecap", "round");
          parent.appendChild(line);
          drops.push(drop);
        }

        var back = document.getElementById("rain-back");
        var front = document.getElementById("rain-front");
        var i;
        for (i = 0; i < 70; i += 1) makeDrop(back, 5.5, 0.28, 1.2);
        for (i = 0; i < 42; i += 1) makeDrop(front, 8, 0.55, 1.6);

        function place(drop) {
          drop.line.setAttribute("x1", drop.x);
          drop.line.setAttribute("y1", drop.y);
          drop.line.setAttribute("x2", drop.x - 7);
          drop.line.setAttribute("y2", drop.y + drop.len);
        }

        drops.forEach(place);

        function tick() {
          if (!motion.matches) {
            for (var n = 0; n < drops.length; n += 1) {
              var drop = drops[n];
              drop.y += drop.v;
              drop.x -= drop.v * 0.12;
              if (drop.y > 700) {
                drop.y = -30;
                drop.x = Math.random() * 1280 - 20;
              }
              place(drop);
            }
          }
          window.requestAnimationFrame(tick);
        }

        function syncMotion() {
          if (motion.matches) svg.pauseAnimations();
          else svg.unpauseAnimations();
        }

        syncMotion();
        if (motion.addEventListener) motion.addEventListener("change", syncMotion);
        window.requestAnimationFrame(tick);

        var button = document.getElementById("rain-toggle");
        var ctx = null;
        var master = null;
        var playing = false;

        function bootAudio() {
          if (ctx) return;
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          ctx = new AudioCtx();
          master = ctx.createGain();
          master.gain.value = 0;
          master.connect(ctx.destination);

          var seconds = 2;
          var count = Math.floor(ctx.sampleRate * seconds);
          var buffer = ctx.createBuffer(1, count, ctx.sampleRate);
          var data = buffer.getChannelData(0);
          for (var n = 0; n < count; n += 1) data[n] = Math.random() * 2 - 1;
          var noise = ctx.createBufferSource();
          noise.buffer = buffer;
          noise.loop = true;
          var band = ctx.createBiquadFilter();
          band.type = "bandpass";
          band.frequency.value = 1700;
          band.Q.value = 0.45;
          var noiseGain = ctx.createGain();
          noiseGain.gain.value = 0.22;
          noise.connect(band).connect(noiseGain).connect(master);
          noise.start();

          var hum = ctx.createOscillator();
          hum.type = "sine";
          hum.frequency.value = 62;
          var humGain = ctx.createGain();
          humGain.gain.value = 0.045;
          hum.connect(humGain).connect(master);
          hum.start();

          var over = ctx.createOscillator();
          over.type = "sine";
          over.frequency.value = 124;
          var overGain = ctx.createGain();
          overGain.gain.value = 0.015;
          over.connect(overGain).connect(master);
          over.start();
        }

        function setPlaying(next) {
          bootAudio();
          playing = next;
          if (ctx.state === "suspended") ctx.resume();
          master.gain.setTargetAtTime(playing ? 1 : 0, ctx.currentTime, 0.05);
          button.setAttribute("aria-pressed", playing ? "true" : "false");
          button.textContent = playing ? "Stop rain" : "Play rain";
        }

        button.addEventListener("click", function () {
          setPlaying(!playing);
        });
      })();
    </script>
