    <main>
      <section class="introduction" aria-labelledby="page-title">
        <div><p class="eyebrow">OPEN LATE. COME AS YOU ARE.</p><h1 id="page-title">A little warmth <em>after dark.</em></h1></div>
        <p class="intro-note">For the long way home.<br> And the ones who take it slowly.</p>
