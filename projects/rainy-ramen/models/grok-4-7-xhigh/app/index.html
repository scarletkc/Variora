<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainy Ramen</title>
  <style>
    :root {
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #05070c;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: min(100vw, 100vh);
      height: min(100vw, 100vh);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      shape-rendering: geometricPrecision;
    }

    #listen {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 2;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid rgba(255, 214, 160, 0.5);
      border-radius: 999px;
      background: rgba(8, 10, 16, 0.72);
      color: #f6ead8;
      font-family: Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    #listen:focus-visible {
      outline: 2px solid #ffd7a1;
      outline-offset: 3px;
    }

    .drop {
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .steam {
      transform-box: fill-box;
      transform-origin: center;
      animation: rise 3.4s ease-in infinite;
    }

    .steam-b { animation-delay: -1.1s; }
    .steam-c { animation-delay: -2.2s; }

    #umbrella {
      transform-box: view-box;
      transform-origin: 200px 790px;
      animation: sway 4.4s ease-in-out infinite;
    }

    .blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.2s infinite;
    }

    .blink-late { animation-delay: -2.4s; }

    .pulse {
      animation: pulse 3.2s ease-in-out infinite;
    }

    .flicker {
      animation: flicker 3.6s linear infinite;
    }

    .shimmer {
      animation: shimmer 4.8s ease-in-out infinite;
    }

    .ripple {
      transform-box: fill-box;
      transform-origin: center;
      animation: rip 3s ease-out infinite;
    }

    .ripple-b { animation-delay: -1.5s; }

    @keyframes fall {
      from { transform: translateY(0); }
      to { transform: translateY(220px); }
    }

    @keyframes rise {
      0% { opacity: 0; transform: translateY(16px); }
      25% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-78px); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-1.4deg); }
      50% { transform: rotate(1.6deg); }
    }

    @keyframes blink {
      0%, 92%, 97%, 100% { transform: scaleY(1); }
      94.5% { transform: scaleY(0.08); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }

    @keyframes flicker {
      0%, 18%, 22%, 57%, 61%, 100% { opacity: 1; }
      20% { opacity: 0.45; }
      59% { opacity: 0.72; }
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 0.5; }
    }

    @keyframes rip {
      0% { transform: scale(0.35); opacity: 0.55; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .drop, .steam, #umbrella, .blink, .pulse, .flicker, .shimmer, .ripple {
        animation: none;
      }
    }
  </style>
</head>

  <script>
    (function () {
      var svgNS = "http://www.w3.org/2000/svg";
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function sheet(id, count, period, length, width, opacity, color, duration) {
        var group = document.getElementById(id);
        var i, x, y0, k, y, line;
        for (i = 0; i < count; i += 1) {
          x = Math.random() * 1080 - 30;
          y0 = Math.random() * period - period;
          for (k = 0; y0 + k * period < 1100; k += 1) {
            y = y0 + k * period;
            line = document.createElementNS(svgNS, "line");
            line.setAttribute("x1", x.toFixed(1));
            line.setAttribute("y1", y.toFixed(1));
            line.setAttribute("x2", (x + length * 0.16).toFixed(1));
            line.setAttribute("y2", (y + length).toFixed(1));
            line.setAttribute("stroke", color);
            line.setAttribute("stroke-width", width);
            line.setAttribute("stroke-linecap", "round");
            line.setAttribute("opacity", opacity);
            if (!reduceMotion) {
              line.classList.add("drop");
              line.style.animationDuration = duration + "s";
            }
            group.appendChild(line);
          }
        }
      }

      sheet("rain-far", 42, 220, 18, "1.2", "0.28", "#d7ecff", 1.7);
      sheet("rain-near", 36, 220, 28, "1.6", "0.55", "#e7f6ff", 1.05);
      sheet("rain-near", 14, 220, 22, "1.4", "0.4", "#ffe0b8", 1.15);

      var button = document.getElementById("listen");
      var audio = null;
      var drips = 0;
      var soundOn = false;

      function noiseBuffer(ctx) {
        var length = ctx.sampleRate * 2;
        var buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        var data = buffer.getChannelData(0);
        var last = 0;
        var i, white;
        for (i = 0; i < length; i += 1) {
          white = Math.random() * 2 - 1;
          last = (last + white * 0.25) * 0.96;
          data[i] = last * 3.2;
        }
        return buffer;
      }

      function loopNoise(ctx, buffer, type, freq, q, gainValue) {
        var source = ctx.createBufferSource();
        var filter = ctx.createBiquadFilter();
        var gain = ctx.createGain();
        source.buffer = buffer;
        source.loop = true;
        filter.type = type;
        filter.frequency.value = freq;
        filter.Q.value = q;
        gain.gain.value = gainValue;
        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start();
        return gain;
      }

      function drip(ctx) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        var now = ctx.currentTime;
        osc.type = "sine";
        osc.frequency.value = 1500 + Math.random() * 1400;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.07, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }

      function buildAudio() {
        var ctx = new AudioContext();
        var buffer = noiseBuffer(ctx);
        var rain = loopNoise(ctx, buffer, "bandpass", 1400, 0.65, 0.16);
        loopNoise(ctx, buffer, "lowpass", 420, 0.7, 0.08);
        var hum = ctx.createOscillator();
        var humGain = ctx.createGain();
        hum.type = "sine";
        hum.frequency.value = 92;
        humGain.gain.value = 0.02;
        hum.connect(humGain);
        humGain.connect(ctx.destination);
        hum.start();
        var lfo = ctx.createOscillator();
        var lfoGain = ctx.createGain();
        lfo.frequency.value = 0.18;
        lfoGain.gain.value = 0.045;
        lfo.connect(lfoGain);
        lfoGain.connect(rain.gain);
        lfo.start();
        drips = window.setInterval(function () {
          if (ctx.state === "running" && Math.random() < 0.55) drip(ctx);
        }, 680);
        return ctx;
      }

      button.addEventListener("click", function () {
        if (!audio) audio = buildAudio();
        soundOn = !soundOn;
        if (soundOn) {
          audio.resume();
          button.textContent = "Quiet";
          button.setAttribute("aria-pressed", "true");
        } else {
          audio.suspend();
          button.textContent = "Listen";
          button.setAttribute("aria-pressed", "false");
        }
      });
    }());
  </script>
